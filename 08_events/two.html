<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Chai aur code</h1>
    <button id="stop">Stop</button>
</body>
<script>

    // setTimeout(function(){
    //     console.log("aakash")
    // } , 2000);



    // const sayaakash = function(){
    //     console.log("aakash");
    // }

    // setTimeout(sayaakash , 2000)


    const changeText = function(){
        document.querySelector('h1').innerHTML = "best JS series"
    }

    const changeMe = setTimeout(changeText, 2000)

    document.querySelector('#stop').addEventListener('click', function(){
        clearTimeout(changeMe) // 2 sec se pahle stop button click kiya to text change nhi hoga 
        console.log("STOPPED")
    })
    

</script>
</html>
