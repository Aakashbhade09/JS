
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="game-card">
        <div class="game-icon">🎯</div>

        <h1>Number Guessing Game</h1>
        <p class="subtitle">Guess the secret number between 1 and 100</p>

        <div class="range">
            <span>MIN <strong>01</strong></span>
            <div class="range-line"></div>
            <span>MAX <strong>100</strong></span>
        </div>

        <form class="guess-form">
            <label for="guessField">Enter your guess</label>
            <input
                type="number"
                id="guessField"
                min="1"
                max="100"
                placeholder="Enter a number..."
                required
                autocomplete="off"
            >
            <button type="submit" id="subt">Submit Guess →</button>
        </form>

        <div class="lowOrHi feedback">
            💡 Your first guess starts here!
        </div>

        <div class="stats">
            <div class="stat">
                <span>Previous Guesses</span>
                <div class="guesses"></div>
            </div>

            <div class="stat">
                <span>Guesses Left</span>
                <div class="lastResult">10</div>
            </div>
        </div>

        <div class="resultParas"></div>

        <footer>Think smart. Guess right.</footer>
    </main>

    <script src="app.js"></script>
</body>
</html>
