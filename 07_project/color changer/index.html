
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Color Changer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <div class="palette-icon">🎨</div>

        <h1>Background <span>Color</span> Changer</h1>

        <p class="subtitle">
            Click on any color below to transform your
            background instantly.
        </p>

        <div class="color-options">
            <button class="button grey" id="grey">
                <span class="color-circle"></span>
                <span>Grey</span>
            </button>

            <button class="button white" id="white">
                <span class="color-circle"></span>
                <span>White</span>
            </button>

            <button class="button blue" id="blue">
                <span class="color-circle"></span>
                <span>Blue</span>
            </button>

            <button class="button yellow" id="yellow">
                <span class="color-circle"></span>
                <span>Yellow</span>
            </button>
        </div>

        <div class="footer">
            <span>&lt;/&gt;</span> Made with JavaScript
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
